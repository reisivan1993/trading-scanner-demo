[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cold-trader-scanner"
version = "0.1.0"
description = "End-of-day stock screening system for swing-trade setups"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<2",
    "pydantic>=2.5,<3",
    "pyyaml>=6.0,<7",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "httpx>=0.27,<1",
    "pandas-market-calendars>=4.3,<5",
    "apscheduler>=3.10,<4",
    "structlog>=24.1,<25",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=4.1,<6",
    "pytest-asyncio>=0.23,<1",
    "pytest-mock>=3.12,<4",
    "ruff>=0.3,<1",
    "mypy>=1.8,<2",
    "pandas-stubs>=2.1,<3",
]

[tool.setuptools.packages.find]
include = ["packages*", "apps*", "src*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.ruff.lint.isort]
known-first-party = ["packages", "apps", "src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["pandas.*", "pandas_market_calendars.*"]
ignore_missing_imports = true
